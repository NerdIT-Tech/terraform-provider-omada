version: "2"

run:
  timeout: 10m

linters:
  enable:
    - copyloopvar
    - durationcheck
    - errorlint
    - forcetypeassert
    - gosec
    - misspell
    - unconvert
    - unparam
  exclusions:
    rules:
      # Acceptance-test helpers (testAccProtoV6ProviderFactories,
      # testAccPreCheck, ...) are used by resource/data-source tests as they
      # are added, so they are legitimately unused until then.
      - path: _test\.go
        linters:
          - unused

formatters:
  enable:
    - gofmt
    - goimports
