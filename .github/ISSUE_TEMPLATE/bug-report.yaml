name: "Bug Report"
description: Report something that's broken or behaving unexpectedly in the provider.
title: "[Bug]: "
labels: ["type: bug", "state: new"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please include enough detail (versions, config sample, actual vs.
        expected) for a maintainer to reproduce it quickly.

        **Found a security vulnerability?** Please do not open a public issue — see [SECURITY.md](../../SECURITY.md)
        for how to report it privately.

  - type: input
    id: provider-version
    attributes:
      label: Provider Version
      description: The `omada` provider version from your `required_providers` / lock file.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: terraform-version
    attributes:
      label: Terraform Version
      description: Output of `terraform version`.
      placeholder: Terraform v1.9.0
    validations:
      required: true

  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Only relevant if building the provider from source.
      placeholder: go1.26.6
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Affected Area
      description: >
        Used to auto-apply an `area: *` label so contributors can filter issues by area they know.
      options:
        - provider schema / configuration
        - resources
        - data sources
        - docs generation
        - CI / GitHub
        - all / cross-cutting
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproduction
      description: A minimal Terraform configuration that reproduces the issue. Redact any real controller URLs, client IDs, or secrets.
      render: hcl
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: Error Output / Stack Trace (if any)
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Anything else — related issues, Omada Controller version, deployment mode (local/cloud), etc.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues (including closed ones) for a duplicate of this bug.
          required: true
        - label: I reproduced this on the latest released version.
          required: true
        - label: I included a minimal reproduction, not just a description.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md instead).
          required: true
