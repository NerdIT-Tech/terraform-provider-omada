# Path-based PR labeling config for actions/labeler.

"area: provider":
    - changed-files:
          - any-glob-to-any-file: "internal/provider/**"

"area: docs":
    - changed-files:
          - any-glob-to-any-file:
                - "docs/**"
                - "templates/**"
                - "examples/**"

"type: documentation":
    - changed-files:
          - any-glob-to-any-file:
                - "**/*.md"

"type: devops":
    - changed-files:
          - any-glob-to-any-file:
                - ".github/workflows/**"
                - ".github/scripts/**"
                - ".github/dependabot.yml"
                - ".github/labeler.yml"
                - ".golangci.yml"
                - ".goreleaser.yml"
                - ".yamllint.yml"
                - ".devcontainer/**"
                - "justfile"

"type: deps":
    - changed-files:
          - any-glob-to-any-file:
                - "go.mod"
                - "go.sum"
